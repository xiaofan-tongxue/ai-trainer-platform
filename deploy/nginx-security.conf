# Deployment template: include inside nginx http {}. Replace domain/certificate paths.
# Backend and proxy are assumed to share the host; set PUBLIC_ORIGIN accordingly.
# Gateway logs need encrypted storage, access control and >= six months retention.
limit_req_zone $binary_remote_addr zone=ait_api:10m rate=360r/m;
limit_req_zone $binary_remote_addr zone=ait_auth:10m rate=15r/m;
limit_conn_zone $binary_remote_addr zone=ait_conn:10m;
log_format ait_security escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"requestId":"$request_id"}';

server {
    listen 80;
    server_name learn.example.org;
    return 308 https://learn.example.org$request_uri;
}
server {
    listen 443 ssl;
    server_name learn.example.org;
    ssl_certificate /etc/nginx/certs/learn.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/learn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 20s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn ait_conn 20;
    limit_req_status 429;
    access_log /var/log/nginx/aitrainer-security.jsonl ait_security;

    proxy_set_header Host learn.example.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
    proxy_cache off;

    location ^~ /api/auth/ {
        limit_req zone=ait_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:19001;
    }
    location ^~ /api/ {
        limit_req zone=ait_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:19001;
    }
    location / {
        proxy_pass http://127.0.0.1:19001;
    }
}
