<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号安全</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="app"></div><script src="/js/common.js"></script><script>
if(!requireAuth())throw new Error('请登录');
const box=renderLayout('password','账号安全','更新密码后全部会话将退出');
box.innerHTML='<section class="card pad"><h2>更新登录密码</h2><p>请设置12–128位密码，至少包含字母和数字。旧账号首次登录和管理员重置密码后，需要完成此步骤。</p><form id="passwordForm"><div class="field"><label for="oldPassword">当前密码</label><input id="oldPassword" type="password" autocomplete="current-password" required maxlength="128"></div><div class="field"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></div><div class="field"><label for="repeatPassword">再次输入新密码</label><input id="repeatPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></div><button class="btn primary" type="submit">更新密码并退出</button><p id="message" role="status"></p></form></section>';
document.getElementById('passwordForm').onsubmit=async e=>{e.preventDefault();const form=e.target,button=form.querySelector('button'),message=document.getElementById('message');if(document.getElementById('newPassword').value!==document.getElementById('repeatPassword').value){message.textContent='两次新密码不一致';return;}button.disabled=true;try{await api('/auth/password','POST',{oldPassword:document.getElementById('oldPassword').value,newPassword:document.getElementById('newPassword').value});sessionStorage.clear();location.href='/login';}catch(err){message.textContent=err.message;button.disabled=false;}};
</script></body></html>
